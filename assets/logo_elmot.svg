<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <style>
    .elmot-text { font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; font-size: 110px; font-style: italic; fill: none; stroke: #ffffff; stroke-width: 3px; letter-spacing: -2px; }
    .elmot-subtext { font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; font-size: 24px; font-style: italic; fill: none; stroke: #fca5a5; stroke-width: 1px; letter-spacing: 6px; }
    .elmot-subtext2 { font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; font-size: 32px; font-style: italic; fill: none; stroke: #e5e7eb; stroke-width: 1.5px; letter-spacing: 8px; }
  </style>
  <rect width="100%" height="100%" fill="transparent" />
  <g transform="skewX(-10)">
    <text x="300" y="105" text-anchor="middle" class="elmot-text">ELMOT</text>
    <text x="305" y="142" text-anchor="middle" class="elmot-subtext">POSSIBILITIES</text>
    <text x="305" y="180" text-anchor="middle" class="elmot-subtext2">ELECTRIFIED</text>
  </g>
</svg>
