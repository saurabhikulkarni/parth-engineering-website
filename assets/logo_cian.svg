<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <style>
    .cian-text { font-family: 'Outfit', 'Montserrat', 'Inter', sans-serif; font-weight: 800; font-size: 68px; fill: #d4af37; font-style: italic; }
    .cian-sub { font-family: 'Outfit', 'Montserrat', 'Inter', sans-serif; font-weight: 700; font-size: 16px; fill: #ffffff; letter-spacing: 0.5px; }
  </style>
  <rect width="100%" height="100%" fill="transparent" />
  <g transform="translate(10, 10)">
    <!-- Golden Leaf & Building Emblem -->
    <g transform="translate(20, 10)">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#d4af37" stroke-width="3" />
      <!-- Stylized Tall Building Lines -->
      <path d="M50,15 L62,45 L58,45 L58,85 L42,85 L42,45 L38,45 Z" fill="#d4af37" />
      <line x1="50" y1="15" x2="50" y2="85" stroke="#000000" stroke-width="1.5" />
      <path d="M22,78 C35,84 40,84 50,84 C60,84 65,84 78,78 C70,72 60,65 50,80 C40,65 30,72 22,78 Z" fill="#d4af37" />
    </g>
    <!-- Text group -->
    <text x="140" y="72" class="cian-text">CIAN</text>
    <text x="140" y="102" class="cian-sub">Agro Industries &amp;</text>
    <text x="140" y="122" class="cian-sub">Infrastructure Ltd.</text>
  </g>
</svg>
